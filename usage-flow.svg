<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ChineseFilenameTool usage flow</title>
  <desc id="desc">Three steps: open the EXE, install the context menu, and convert a filename from the right-click menu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff7f3"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a65"/>
      <stop offset="1" stop-color="#e85d75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18263d" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#203044" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="28" font-weight="700">三步開始使用</text>

  <g filter="url(#shadow)">
    <rect x="48" y="105" width="310" height="230" rx="20" fill="#ffffff"/>
    <rect x="445" y="105" width="310" height="230" rx="20" fill="#ffffff"/>
    <rect x="842" y="105" width="310" height="230" rx="20" fill="#ffffff"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="104" cy="160" r="27"/><circle cx="501" cy="160" r="27"/><circle cx="898" cy="160" r="27"/>
  </g>
  <g fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="104" y="168">1</text><text x="501" y="168">2</text><text x="898" y="168">3</text>
  </g>
  <g fill="#203044" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700">
    <text x="82" y="225">開啟 EXE</text>
    <text x="479" y="225">安裝右鍵選單</text>
    <text x="876" y="225">選擇轉換方向</text>
  </g>
  <g fill="#69788b" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="17">
    <text x="82" y="263">雙擊 ChineseFilenameTool.exe</text>
    <text x="479" y="263">按下「安裝這個工具」</text>
    <text x="876" y="263">右鍵檔案或資料夾</text>
    <text x="876" y="290">選擇繁體或簡體中文</text>
  </g>
  <g stroke="#e85d75" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M374 220h48l-12-12m12 12-12 12"/>
    <path d="M771 220h48l-12-12m12 12-12 12"/>
  </g>
</svg>
